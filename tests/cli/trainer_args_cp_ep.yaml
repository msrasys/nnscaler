vars:
  hidden_size: 16
  sequence_length: 128
  num_experts: 4
  num_layers: 3
  context_parallel_size: 4

compute_config:
  plan_ngpus: 2
  runtime_ngpus: 4
  constant_folding: true
  use_zero: 0
  use_end2end: true

run_mode: run
pas_policy: tests.cli.test_cp_ep.cp_ep_policy
micro_batch_size: 2
global_batch_size: 4
max_train_steps: 30
seed: 0
init_env_fn: tests.cli.test_cp_ep.init_cp_ep_groups

model:
  type: tests.cli.test_cp_ep.ContextExpertModel
  args:
    hidden_size: $(vars.hidden_size)
    sequence_length: $(vars.sequence_length)
    num_experts: $(vars.num_experts)
    num_layers: $(vars.num_layers)
    expert_parallel_size: $(compute_config.plan_ngpus)
    context_parallel_size: $(vars.context_parallel_size)
    runtime_ngpus: $(compute_config.runtime_ngpus)
    use_context_parallel: false

optimizer:
  type: torch.optim.Adam
  grad_reduction: sum
  args:
    lr: 0.01

dataset:
  type: tests.cli.test_cp_ep.LongSequenceDataset
  train_args:
    hidden_size: $(vars.hidden_size)
    sequence_length: $(vars.sequence_length)
    size: 8
  val_args:
    hidden_size: $(vars.hidden_size)
    sequence_length: $(vars.sequence_length)
    size: 8

dataset_sampler:
  type: tests.cli.test_cp_ep.ContextGroupSampler
  train_args:
    context_parallel_size: $(vars.context_parallel_size)
    expert_parallel_size: $(compute_config.plan_ngpus)
    shuffle: false
  val_args:
    context_parallel_size: $(vars.context_parallel_size)
    expert_parallel_size: $(compute_config.plan_ngpus)
    shuffle: false

dataloader:
  train_args:
    drop_last: true
    shuffle: false
  val_args:
    drop_last: true
    shuffle: false

checkpoint:
  keep_last_n_checkpoints: 1
  every_n_train_steps: 30
  save_type: deduped