vars:
  dim: 16
  drop_last: true

compute_config:
  plan_ngpus: 2
  runtime_ngpus: 4
  constant_folding: true
  use_zero: true
  use_end2end: true
  pas_config:
    pipeline_nstages: 2
    pipeline_scheduler: 1f1b
    pipeline_nmicros:
      - 2
      - 4

run_mode: run
pas_policy: hybrid
micro_batch_size: 2
# step-dependent schedule: keys are global train-step thresholds.
# with micro_batch_size=2 and scaling_factor=2, update_freq = gbs // 4,
# so this yields nmicros 2 for steps [0, 5) and 4 from step 5 onward.
global_batch_size:
  0: 8
  5: 16
max_epochs: 4
max_train_steps: 100
seed: 0
enable_progress_bar: false

model:
  type: tests.cli.common.MLP
  args:
    dim: $(vars.dim)
    nlayers: 16

optimizer:
  type: torch.optim.Adam
  args:
    lr: 0.01

dataset:
  type: tests.cli.common.SimpleDataset
  train_args:
    dim: $(vars.dim)
    size: 100
  val_args:
    dim: $(vars.dim)
    size: 10

dataloader:
  train_args:
    drop_last: $(vars.drop_last)
  val_args:
    drop_last: $(vars.drop_last)

checkpoint:
  keep_last_n_checkpoints: 30
  every_n_train_steps: 1
  save_type: deduped
